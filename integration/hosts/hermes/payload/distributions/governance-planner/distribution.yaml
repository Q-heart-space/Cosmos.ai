description: "Q博士深度治理规划技能。当用户要求对自进化/治理/宪法/元安全话题做多轮深挖、从第一原理推导、产出可执行分解计划时触发。负责衔接 治理对话深挖协议——决定何时继续深挖根因、何时停止分析并开始构建、何时将"做不到"转为任务。提取自 Q博士 2026-07-19 五轮对话深挖实战。、Q博士 元治理审视入口——决策OS六维过审·七维审计·深度审视。 所有重大决策/宪法修订/治理升级前必须经过此技能的模式一审阅。 触发词：决策OS、原点复盘、系统审视、商业化分析、决策审查、使命愿景、价值是否存在、能否迁移、通用任务复盘改善技能 v3.35。4种执行模式·复盘模板 A-M（13模板·模板库实际收录 A-E/H/I·全面审查/Template L 职责由 多Agent执行后的对抗式审查+递归闭环修复标准化管道。Q博士三轨定位工程化落地。触发词（14）"对抗式审查"/"对抗审计"/"递归闭环修复"/"多Agent验证"/"通电验证"/"真实验证"/"有没有遗漏"/"风险点"/"十维审核"/"公开仓库 Commit 干净原则（2026-07-01 确立）"/"追问校准"/"从哪得出"/"不要断言"/"显式落位"。≥3 Agent并行执行后强制执行。v3.24·㉚宿主运行时约束检查（2026-09-11 三层递减不变式·4 判例·hook_runtime_guard 工程化）·㉘审计者反身性原子·反模式落地数以反模式门禁映射表实测为准·anti_pattern_gate_router --audit 验证·power_verifier·497通电·接入timeout_calibrator v2.1·META lifecycle CLOSED (2026-08-12) 技能承担·2026-08-23 XSG-D0 表述对齐）·文档迭代完整性七维自检文档迭代完整性七维自检+META-39 v3.0分层决策锚定（T0-T5·六维+七维+⓪Meta·M-90升级）+🆕十维审核框架（多层次审核强制清单——十一维审核框架（2026-07-09 确立·2026-07-11 十维→十一维·+语义蕴含·全局·阻断级）·形式/内容/结构/关联/概念/版本/可验证/意图/同源/反身性）。 覆盖分析→修复技能→升级规则→写记忆完整闭环。触发词：复盘、深度溯源、五模式复盘、四模式复盘、元模式复盘、强制深度复盘、全时空复盘、原点复盘、精简复盘、首次事件复盘、全局修订。（🆕 2026-08-28：全链路审计/全局修订/有没有遗漏 已归位 qdr-full-chain-audit 与 多Agent执行后的对抗式审查+递归闭环修复标准化管道。Q博士三轨定位工程化落地。触发词（14）"对抗式审查"/"对抗审计"/"递归闭环修复"/"多Agent验证"/"通电验证"/"真实验证"/"有没有遗漏"/"风险点"/"十维审核"/"公开仓库 Commit 干净原则（2026-07-01 确立）"/"追问校准"/"从哪得出"/"不要断言"/"显式落位"。≥3 Agent并行执行后强制执行。v3.24·㉚宿主运行时约束检查（2026-09-11 三层递减不变式·4 判例·hook_runtime_guard 工程化）·㉘审计者反身性原子·反模式落地数以反模式门禁映射表实测为准·anti_pattern_gate_router --audit 验证·power_verifier·497通电·接入timeout_calibrator v2.1·META lifecycle CLOSED (2026-08-12)）（🆕 深度审核/形式内容结构 已归位 多Agent执行后的对抗式审查+递归闭环修复标准化管道。Q博士三轨定位工程化落地。触发词（14）"对抗式审查"/"对抗审计"/"递归闭环修复"/"多Agent验证"/"通电验证"/"真实验证"/"有没有遗漏"/"风险点"/"十维审核"/"公开仓库 Commit 干净原则（2026-07-01 确立）"/"追问校准"/"从哪得出"/"不要断言"/"显式落位"。≥3 Agent并行执行后强制执行。v3.24·㉚宿主运行时约束检查（2026-09-11 三层递减不变式·4 判例·hook_runtime_guard 工程化）·㉘审计者反身性原子·反模式落地数以反模式门禁映射表实测为准·anti_pattern_gate_router --audit 验证·power_verifier·497通电·接入timeout_calibrator v2.1·META lifecycle CLOSED (2026-08-12)·十维审核·2026-08-27 XSG-D0）（🆕 M-90 架构修正："审视决策""六维""七维""第一原理"等治理审查类触发词已路由至 qdr-meta-governance-review。本技能专注复盘引擎——A0.6路径B（AI自动判定T0-T4）保留，路径A（人类话语）已分离。），产出本体论对齐、元安全映射、竞品转化分析与治理行动分解计划。"
